<!-- Сообщает браузеру: это современный HTML5. Без этой строки браузер может включить «режим совместимости». -->
<!DOCTYPE html>
<!-- Указывает язык страницы (русский). -->
<html lang="ru">
<!-- «Голова» страницы: тут лежат настройки, стили и скрипты - они не видны на экране, но критически важны. -->    
<head> 
    <!-- Кодировка UTF‑8: чтобы корректно отображались все символы, включая кириллицу и спецсимволы (важно для подписей к слайдам). -->
    <meta charset="UTF-8">
    <!-- Делает страницу адаптивной: ширина экрана устройства = ширина сайта, начальный масштаб 1. Без этого на телефоне слайдер будет мелким или обрезанным. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Заголовок вкладки браузера. Важен для пользователя и SEO. -->
    <title>Слайд-шоу</title>
    
    <!-- Подключение CSS. Подключает стили: фон, градиенты, рамки, анимации, позиционирование слайдов и подписи. -->
    <link rel="stylesheet" href="styles/style.css">
    
    <!-- Подключение библиотеки. Загружает вспомогательные функции (например, предзагрузка картинок, утилиты). Выполняется сразу при загрузке. -->
    <script src="scripts/library.js"></script>
    
    <!-- Основной скрипт слайдера (переключение, автозапуск, кнопка Старт/Стоп). defer гарантирует - скрипт запустится после построения HTML. -->
    <script src="scripts/slideshow.js" defer></script>
</head>
<!-- Тело страницы: здесь все, что видит пользователь. -->
<body>
    <!-- Декоративная надпись проекта. Класс .project-title нужен, чтобы стилизовать ее отдельно (шрифт, цвет, отступы) от слайдера. -->
    <div class="project-title">Пейзажи России</div>

    <!-- Контейнер для слайд-шоу. id="slides" нужен JS, чтобы найти контейнер и управлять слайдами (добавлять классы .running, переключать картинки). -->
    <div id="slides">         
        <!-- Картинка пока пустая: JS позже подставит путь. Размеры заранее заданы, чтобы страница не «прыгала», когда фото загрузится. -->
        <img width="480" height="640" src="" alt="Слайд-шоу">        
    </div>
</body>
</html>
