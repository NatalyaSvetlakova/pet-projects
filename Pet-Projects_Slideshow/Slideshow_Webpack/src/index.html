<!-- Объявляем тип документа, чтобы браузер понимал: это современный HTML5 -->
<!DOCTYPE html>
<!-- Корневой элемент страницы; lang="ru" сообщает браузеру и скринридерам, что язык контента - русский -->
<html lang="ru">
    <!-- Секция с технической информацией и подключениями, которая не показывается напрямую на странице -->
    <head>
         <!-- Указываем кодировку UTF‑8, чтобы корректно отображались кириллица, эмодзи и спецсимволы -->
        <meta charset="UTF-8" />
        <!-- Настраиваем адаптивность: ширина viewport равна ширине экрана устройства, начальный масштаб 1.0 -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Заголовок вкладки браузера - то, что видно на вкладке с сайтом -->
        <title>Retro-car Slide-show</title>
         <!-- Подключаем шрифты из Google Fonts: Playfair Display (для заголовков) и Great Vibes (для декоративных надписей) -->
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">
    </head>
<!-- Основная видимая часть страницы -->    
<body>
    <!-- Контейнер, куда React будет «вставлять» все приложение (компонент Slideshow) -->
     <div id="root"></div>
</body>
</html>
